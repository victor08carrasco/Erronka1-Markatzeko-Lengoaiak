<!DOCTYPE html>
<html lang='eu'>
<head>
    <meta charset='utf-8'>

    <title>Harremanetarako formularioa</title>
    <link rel='stylesheet' href='../styles/main.css'>
    <link rel="icon" type="image/x-icon" href="../img/icons/favicon.png">
    <link rel='stylesheet' href='../styles/formularioa.css'>
</head>
<body>
    <header>
        <nav>
            <a href='../index.html'>
                <img src='../img/Logo-zuria.png' alt='GameStop Logo' title='GameStop Logo' class='logo'>
            </a>
        </nav>
    </header>
    <main>
        <div class="formularioa">
            <h1>Harremanetarako formularioa</h1>
            <p><small>*Derrigorrezko eremuak</small></p>
            <form action="mailto:info@gamestop.com" method="post" enctype="text/plain">
                <fieldset>
                    <legend>Datuak</legend>
                    <label for="Izen-Abizenak">*Izen-Abizenak:</label>
                    <input type="text" id="Izen-Abizenak" name="Izen-Abizenak" required placeholder="Jhon Doe"><br><br>
                    <label for="emaila">*Emaila:</label>
                    <input type="email" id="emaila" name="emaila" required placeholder="jhon.doe@example.org"><br><br>
                    <label for="Telefonoa">*Telefono zenbakia:</label>
                    <input type="tel" id="Telefonoa" name="Telefonoa" required placeholder="+34 123 456 789"><br><br>
                    <label for="herrialdeak">*Herrialdea:</label>
                        <select id="herrialdeak" name="herrialdeak" required>
                            <option value="" disabled selected>Aukeratu...</option>
                            <option value="Albania">Albania</option>
                            <option value="Alemania">Alemania</option>
                            <option value="Andorra">Andorra</option>
                            <option value="Austria">Austria</option>
                            <option value="Belgika">Belgika</option>
                            <option value="Bielorrusia">Bielorrusia</option>
                            <option value="Bosnia eta Herzegovina">Bosnia eta Herzegovina</option>
                            <option value="Bulgaria">Bulgaria</option>
                            <option value="Danimarka">Danimarka</option>
                            <option value="Erresuma Batua">Erresuma Batua</option>
                            <option value="Errumania">Errumania</option>
                            <option value="Errusia">Errusia</option>
                            <option value="Eslovakia">Eslovakia</option>
                            <option value="Eslovenia">Eslovenia</option>
                            <option value="Espainia">Espainia</option>
                            <option value="Estonia">Estonia</option>
                            <option value="Finlandia">Finlandia</option>
                            <option value="Frantzia">Frantzia</option>
                            <option value="Grezia">Grezia</option>
                            <option value="Herbehereak">Herbehereak</option>
                            <option value="Hungaria">Hungaria</option>
                            <option value="Irlanda">Irlanda</option>
                            <option value="Islandia">Islandia</option>
                            <option value="Italia">Italia</option>
                            <option value="Kroazia">Kroazia</option>
                            <option value="Letonia">Letonia</option>
                            <option value="Liechtenstein">Liechtenstein</option>
                            <option value="Lituania">Lituania</option>
                            <option value="Luxenburgo">Luxenburgo</option>
                            <option value="Malta">Malta</option>
                            <option value="Moldavia">Moldavia</option>
                            <option value="Monako">Monako</option>
                            <option value="Montenegro">Montenegro</option>
                            <option value="Norvegia">Norvegia</option>
                            <option value="Polonia">Polonia</option>
                            <option value="Portugal">Portugal</option>
                            <option value="San Marino">San Marino</option>
                            <option value="Serbia">Serbia</option>
                            <option value="Suedia">Suedia</option>
                            <option value="Suitza">Suitza</option>
                            <option value="Turkia">Turkia</option>
                            <option value="Txekia">Txekia</option>
                            <option value="Ukraina">Ukraina</option>
                            <option value="Zipre">Zipre</option>
                        </select>
                </fieldset>
                <fieldset>
                    <legend>Mezua</legend>
                <label for="mezua">*Mezua:</label><br>
                <textarea id="mezua" name="mezua" minlength="10" maxlength="1000" rows="2" required placeholder="Idatzi zure mezua hemen..."></textarea><br><br>
                </fieldset>     
                <input type="submit" value="Bidali">
                <input type="reset" value="Garbitu">
            </form>
        </div>
        <div class="Kokapena">
            <br>
            <h1>Kokapena</h1>
            <iframe width="425" height="350" src="https://www.openstreetmap.org/export/embed?bbox=-3.0416893959045415%2C43.32365960399048%2C-3.037210106849671%2C43.32539816859654&amp;layer=mapnik&amp;marker=43.324528892513%2C-3.0394497513771057"></iframe><br/>
            <small>
                <a href="https://www.openstreetmap.org/?mlat=43.324529&amp;mlon=-3.039450#map=19/43.324529/-3.039450" target="_blank">Ikusi mapa handiago</a>
            </small>
        </div>
    </main>
